<div class="search">
  <mat-icon class="search__icon" aria-hidden="true">search</mat-icon>
  <input
    class="search__input"
    type="search"
    placeholder="Search for places…"
    aria-label="Search for places"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    [matAutocomplete]="auto"
  />
  <button
    matIconButton
    class="search__locate"
    aria-label="Use my location"
    matTooltip="Use my location"
    (click)="locateRequested.emit()"
  >
    <mat-icon>my_location</mat-icon>
  </button>
</div>

<mat-autocomplete
  #auto
  class="search-results"
  [displayWith]="displayNothing"
  (optionSelected)="select($event)"
>
  @switch (status()) {
    @case ('searching') {
      <mat-option class="result result--status" disabled>
        <mat-progress-spinner mode="indeterminate" diameter="18" />
        Searching…
      </mat-option>
    }
    @case ('empty') {
      <mat-option class="result result--status" disabled>No places found</mat-option>
    }
    @case ('error') {
      <mat-option class="result result--status" disabled
        >Search isn't available right now</mat-option
      >
    }
    @case ('done') {
      @for (result of results(); track result.id) {
        <mat-option class="result" [value]="result">
          <mat-icon>location_on</mat-icon>
          <span class="result__name">{{ result.name }}</span>
          @if (result.detail) {
            <span class="result__detail">{{ result.detail }}</span>
          }
        </mat-option>
      }
    }
  }
</mat-autocomplete>
