# Tests and builds every pull request; on `main` it also publishes to GitHub Pages at
# https://jsamcolipapa.github.io/weather-app-angular/ — but only if the tests pass.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch/PR. A newer push cancels a pull request's older run, but deployments to
# Pages always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read by scripts/set-env.mjs (runs as `prebuild`) in place of .env, which isn't committed.
      # These are public API URLs (they ship in the bundle anyway), so defaults live here; set a
      # repository variable of the same name to override one.
      FORECAST_URL: ${{ vars.FORECAST_URL || 'https://api.open-meteo.com/v1/forecast' }}
      AIR_QUALITY_URL: ${{ vars.AIR_QUALITY_URL || 'https://air-quality-api.open-meteo.com/v1/air-quality' }}
      SEARCH_URL: ${{ vars.SEARCH_URL || 'https://photon.komoot.io/api/' }}
      REVERSE_GEOCODE_URL: ${{ vars.REVERSE_GEOCODE_URL || 'https://api.bigdatacloud.net/data/reverse-geocode-client' }}
      RAINVIEWER_URL: ${{ vars.RAINVIEWER_URL || 'https://api.rainviewer.com/public/weather-maps.json' }}
      MAP_TILE_URL: ${{ vars.MAP_TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      # Pages serves the site under /<repo>/, so links and assets must resolve from there.
      - run: npm run build -- --base-href /weather-app-angular/

      # Pages shows 404.html for unknown paths; serving the app there keeps reloads working.
      - run: cp dist/weather-app-angular/browser/index.html dist/weather-app-angular/browser/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/weather-app-angular/browser

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
